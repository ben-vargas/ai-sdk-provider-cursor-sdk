name: Cursor SDK Canary

# Weekly drift check against the unpinned @cursor/sdk@latest. The regular CI
# workflow remains the health signal for the package's pinned 1.0.31 dependency.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-sdk-drift:
    name: Upstream SDK drift (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    # Separate outputs retain both failures regardless of matrix completion order.
    outputs:
      node22: ${{ steps.outcome.outputs.node22 }}
      node24: ${{ steps.outcome.outputs.node24 }}

    steps:
      - uses: actions/checkout@v6
        with:
          # The matrix has read-only permissions. Keep its token out of git
          # config as additional protection when installing unpinned dependencies.
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Install @cursor/sdk@latest without saving
        run: npm install --no-save --ignore-scripts @cursor/sdk@latest

      - name: Print resolved SDK version
        run: |
          echo "Pinned version in package.json:"
          node -e "console.log(require('./package.json').dependencies['@cursor/sdk'])"
          echo "Resolved @latest version under test:"
          node -e "console.log(require('./node_modules/@cursor/sdk/package.json').version)"

      - name: Type check against @latest
        id: typecheck
        run: npm run typecheck

      - name: Unit tests against @latest
        id: tests
        run: npm test

      # Infrastructure failures never reach these checks and must not file drift.
      - name: Record drift outcome
        id: outcome
        if: failure() && (steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure')
        env:
          NODE_VERSION: ${{ matrix.node-version }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = {
            node: process.env.NODE_VERSION,
            sdkVersion: JSON.parse(fs.readFileSync('node_modules/@cursor/sdk/package.json', 'utf8')).version,
            pinned: JSON.parse(fs.readFileSync('package.json', 'utf8')).dependencies['@cursor/sdk'],
            failedStep: process.env.TYPECHECK_OUTCOME === 'failure' ? 'typecheck' : 'unit tests',
          };
          const key = `node${process.env.NODE_VERSION.split('.')[0]}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${JSON.stringify(report)}\n`);
          NODE

  # One writer after both matrix jobs finish avoids the race seen in #6/#7.
  file-drift-issue:
    name: File or update SDK drift issue
    needs: upstream-sdk-drift
    if: >-
      always() && !cancelled() &&
      (needs.upstream-sdk-drift.outputs.node22 != '' || needs.upstream-sdk-drift.outputs.node24 != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    # A repository-wide group also prevents overlapping runs from racing the
    # list-then-create operation. Never interrupt a writer already in progress.
    concurrency:
      group: cursor-sdk-canary-issue
      cancel-in-progress: false

    steps:
      - uses: actions/github-script@v8
        env:
          NODE22_REPORT: ${{ needs.upstream-sdk-drift.outputs.node22 }}
          NODE24_REPORT: ${{ needs.upstream-sdk-drift.outputs.node24 }}
        with:
          script: |
            const reports = [process.env.NODE22_REPORT, process.env.NODE24_REPORT]
              .filter(Boolean)
              .map(report => JSON.parse(report));
            const title = 'SDK canary failing against @cursor/sdk@latest';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The weekly canary detected upstream SDK drift.',
              '',
              `- Run: ${runUrl}`,
              ...reports.map(report =>
                `- Node ${report.node}: ${report.failedStep} failed against \`@cursor/sdk@${report.sdkVersion}\` (pinned: \`${report.pinned}\`).`
              ),
              '',
              'This job tests upstream drift, not the pinned-dependency health signal.',
              'Typecheck includes the option/event coverage guard in',
              '`src/options-coverage.test.ts`; tests replay captured event fixtures.',
              '',
              'Triage any new option or event deliberately: map it, reject it, or add a',
              'documented known-excluded classification before updating the exact pin.',
            ].join('\n');

            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Still failing.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
